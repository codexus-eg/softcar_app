workflows:
  softcar-flutter-ios-workflow:
    name: Soft Car Flutter iOS Build & Publish
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: noourway

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        provisioning_profiles:
          - softcar_Manual_Profile
        certificates:
          - ios_cert_manual

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Build Flutter iOS (IPA)
        script: |
          # أداة فلتر مدمجة تقوم بالبناء والتوقيع وتجهيز ملف الـ IPA مباشرة
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - codexus.eg@gmail.com
